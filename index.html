<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoW Forever - Leveling & Profession Hub</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html { font-size: 150%; }
    body { background-color: #090d16; color: #cbd5e1; font-family: 'Inter', system-ui, sans-serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    
    /* Scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }

    /* Class Accents */
    .theme-hunter { --accent: #aad372; }
    .theme-warlock { --accent: #9482c9; }
    .theme-paladin { --accent: #f58cba; }
    .theme-priest { --accent: #ffffff; }
    .theme-shaman { --accent: #0070de; }
    .theme-warrior { --accent: #c79c6e; }
    .theme-mage { --accent: #69ccf0; }
    .theme-rogue { --accent: #fff569; }
    .theme-druid { --accent: #ff7d0a; }

    .color-hunter { color: #aad372; }
    .color-warlock { color: #9482c9; }
    .color-paladin { color: #f58cba; }
    .color-priest { color: #ffffff; }
    .color-shaman { color: #0070de; }
    .color-warrior { color: #c79c6e; }
    .color-mage { color: #69ccf0; }
    .color-rogue { color: #fff569; }
    .color-druid { color: #ff7d0a; }

    .border-hunter { border-color: rgba(170, 211, 114, 0.4); }
    .border-warlock { border-color: rgba(148, 130, 201, 0.4); }
    .border-paladin { border-color: rgba(245, 140, 186, 0.4); }
    .border-priest { border-color: rgba(255, 255, 255, 0.4); }
    .border-shaman { border-color: rgba(0, 112, 222, 0.4); }
    .border-warrior { border-color: rgba(199, 156, 110, 0.4); }
    .border-mage { border-color: rgba(105, 204, 240, 0.4); }
    .border-rogue { border-color: rgba(255, 245, 105, 0.4); }
    .border-druid { border-color: rgba(255, 125, 10, 0.4); }

    .topTab { font-size: 0.95rem; font-weight: 600; padding: 0.5rem 1rem; border-radius: 0.6rem; color: #94a3b8; border: 1px solid transparent; }
    .topTab:hover { color: #e2e8f0; }
    .topTab-on { color: #fcd34d; background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.4); }
    .subTab { font-size: 0.85rem; padding: 0.3rem 0.8rem; border-radius: 999px; color: #94a3b8; border: 1px solid #1e293b; }
    .subTab:hover { color: #e2e8f0; }
    .subTab-on { color: #fcd34d; border-color: rgba(245, 158, 11, 0.5); }
    .hover-card:hover { transform: translateY(-2px); border-color: rgba(245, 158, 11, 0.5); }
    /* Route folds (js/route.js): no browser marker; the arrow turns when open. */
    .route-fold > summary::-webkit-details-marker { display: none; }
    .route-fold[open] > summary .route-arrow { transform: rotate(90deg); }
    .route-arrow { display: inline-block; transition: transform 0.15s; }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#090d16] text-slate-300 antialiased selection:bg-amber-500/20 selection:text-amber-300">

  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-slate-950/80 backdrop-blur sticky top-0 z-30 px-6 md:px-10 py-2 flex flex-wrap items-center justify-between gap-2">
    <div class="flex items-center space-x-3 cursor-pointer whitespace-nowrap" onclick="backToOverview()">
      <span class="text-xl">⚔️</span>
      <span class="font-cinzel font-bold text-amber-500 tracking-wide text-base">WoW Forever</span>
      <span class="text-[0.75rem] px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20 font-medium">Horde Engine</span>
    </div>

    <!-- Realm Picker -->
    <div class="flex flex-wrap items-center gap-2">
      <div class="flex items-center space-x-2 bg-slate-900/90 border border-slate-800 rounded-lg px-3 py-1.5 shadow-sm">
        <span class="text-xs text-slate-400 font-medium">Realm:</span>
        <select id="realmSelect" onchange="switchRealm()" class="bg-transparent text-xs font-semibold text-amber-400 focus:outline-none cursor-pointer">
          <option value="forever-pvp-eu">[EU] WoW Forever - PvP (Launch Plan)</option>
          <option value="forever-pve-eu">[EU] WoW Forever - Normal (Launch Plan)</option>
        </select>
      </div>
      <div class="flex items-center space-x-1 bg-slate-900/90 border border-slate-800 rounded-lg p-1" title="Text size (saved for this screen)">
        <button onclick="changeFontSize(-10)" class="text-xs font-semibold px-2 py-1 rounded text-slate-300 hover:text-amber-300">A−</button>
        <button onclick="changeFontSize(10)" class="text-sm font-semibold px-2 py-1 rounded text-slate-300 hover:text-amber-300">A+</button>
      </div>
      <div class="flex items-center space-x-1 bg-slate-900/90 border border-slate-800 rounded-lg p-1">
        <button id="syncGameBtn" onclick="runSync(false)" title="Read the latest data saved by the in-game addon"
                class="text-xs font-semibold px-2.5 py-1 rounded bg-amber-500/20 text-amber-300 hover:bg-amber-500/30 disabled:opacity-50">⟳ Sync</button>
        <button id="syncBnetBtn" onclick="runSync(true)" title="Log in to Battle.net and sync Classic Era characters too"
                class="text-xs font-medium px-2.5 py-1 rounded text-slate-400 hover:text-slate-200 disabled:opacity-50">+ Battle.net</button>
      </div>
      <div id="statusBadge"class="text-[0.75rem] px-2.5 py-1 rounded-md bg-emerald-950/50 border border-emerald-500/30 text-emerald-400 flex items-center space-x-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="statusText">Beta Client</span>
      </div>
    </div>
  </header>

  <!-- Top tabs: Launch stays until every launch step is done -->
  <nav class="max-w-[1550px] w-full mx-auto px-6 md:px-10 pt-4 flex flex-wrap items-center gap-2">
    <button id="top-launch" onclick="openTab('launch')" class="topTab">🚀 Launch</button>
    <button id="top-characters" onclick="openTab('characters')" class="topTab topTab-on">👥 Characters</button>
    <button id="top-professions" onclick="openTab('professions')" class="topTab">⚒ Professions</button>
    <button id="top-ah" onclick="openTab('ah')" class="topTab">🏦 Auction House</button>
  </nav>
  <div id="subnav" class="hidden max-w-[1550px] w-full mx-auto px-6 md:px-10 pt-3 flex flex-wrap gap-2"></div>

  <!-- Main Container -->
  <main class="flex-1 max-w-[1550px] w-full mx-auto px-6 md:px-10 py-6 md:py-8">

    <!-- Auction House pages -->
    <section id="methodsView" class="hidden space-y-4"></section>
    <section id="mountView" class="hidden space-y-4"></section>

    <!-- Professions page: Merchant's Favor -->
    <section id="favorView" class="hidden space-y-4"></section>

    <!-- VIEW G: Launch checklist -->
    <section id="launchView" class="hidden space-y-4"></section>

    <!-- VIEW F: Trainers and vendors -->
    <section id="trainersView" class="hidden space-y-4"></section>

    <!-- VIEW E: Camping -->
    <section id="campingView" class="hidden space-y-4"></section>

    <!-- VIEW D: Recipes (all professions) -->
    <section id="recipesView" class="hidden space-y-4"></section>

    <!-- VIEW C: Auction House (whole account) -->
    <section id="auctionView" class="hidden space-y-4"></section>

    <!-- VIEW A: Minimalist Character Grid -->
    <section id="characterGridView" class="space-y-6">
      <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 pb-4 border-b border-slate-800/80">
        <div>
          <h2 id="realmTitle" class="text-xl font-bold text-slate-100 flex items-center gap-2">
            <span>Classic Beta PvP</span>
            <span class="text-xs font-normal px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700" id="charCountBadge">3 Characters</span>
          </h2>
          <p id="realmSubtitle" class="text-xs text-slate-400 mt-1">Select a character to view their leveling path, quest skips, and profession supply chain.</p>
        </div>
        
        <!-- Filter Tabs -->
        <div class="flex items-center space-x-1 bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
          <button onclick="filterGroup('all')" id="tab-all" class="px-3 py-1 rounded bg-amber-500/20 text-amber-300 font-medium">All</button>
          <button onclick="filterGroup('g1')" id="tab-g1" class="px-3 py-1 rounded text-slate-400 hover:text-slate-200">Group 1</button>
          <button onclick="filterGroup('g2')" id="tab-g2" class="px-3 py-1 rounded text-slate-400 hover:text-slate-200">Group 2</button>
          <button onclick="filterGroup('g3')" id="tab-g3" class="px-3 py-1 rounded text-slate-400 hover:text-slate-200">Group 3</button>
          <select id="charSort" onchange="setCharSort(this.value)" class="ml-2 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-300" title="Sort the characters">
            <option value="order">Plan order</option>
            <option value="level">Level</option>
            <option value="rested">Rested XP</option>
          </select>
        </div>
      </div>

      <!-- Cards Grid -->
      <div id="characterCardsContainer" class="grid grid-cols-1 md:grid-cols-2 2xl:grid-cols-3 gap-4">
        <!-- Injected via JavaScript -->
      </div>

      <!-- Rested XP and Legacy points (js/legacy.js), below the cards -->
      <div id="accountCards" class="grid grid-cols-1 xl:grid-cols-2 gap-4"></div>
    </section>

    <!-- VIEW B: Character Focus Drilldown (Hidden by default) -->
    <section id="characterDetailView" class="hidden space-y-6">
      
      <!-- Back Navigation Bar -->
      <div class="flex items-center justify-between">
        <button onclick="backToOverview()" class="inline-flex items-center space-x-2 text-xs font-semibold text-slate-400 hover:text-amber-400 transition bg-slate-900/60 border border-slate-800 px-3 py-1.5 rounded-lg">
          <span>←</span>
          <span>Back to Character Overview</span>
        </button>

        <!-- Progress Summary Pill -->
        <div id="detailProgressPill" class="text-xs text-slate-400">
          <!-- Injected JS -->
        </div>
      </div>

      <!-- Character Hero Card -->
      <div id="characterHero" class="p-6 rounded-2xl bg-gradient-to-r from-slate-900 to-slate-950 border border-slate-800 shadow-xl flex flex-col md:flex-row md:items-center justify-between gap-6">
        <!-- Injected JS -->
      </div>

      <!-- Dual Category Tabs: Leveling vs Professions -->
      <div class="flex flex-wrap border-b border-slate-800 gap-x-8 gap-y-2 text-sm font-medium">
        <button onclick="switchCategory('leveling')" id="catTab-leveling" class="pb-3 border-b-2 border-amber-500 text-amber-400 flex items-center space-x-2">
          <span>🧭</span>
          <span>Route</span>
        </button>
        <button onclick="switchCategory('professions')" id="catTab-professions" class="pb-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center space-x-2">
          <span>⚒️</span>
          <span>Professions</span>
        </button>
        <button onclick="switchCategory('money')" id="catTab-money" class="pb-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center space-x-2">
          <span>💰</span>
          <span>Money</span>
        </button>
      </div>

      <!-- Category Content 1: Leveling -->
      <div id="categoryLeveling" class="space-y-6">
        

        <!-- Zones Timeline List -->
        <div id="zonesTimelineContainer" class="p-4 rounded-xl bg-slate-900/60 border border-slate-800">
          <!-- Injected JS -->
        </div>
      </div>

      <!-- Category Content 3: Money for this character -->
      <div id="categoryMoney" class="hidden space-y-4"></div>

      <!-- Category Content 2: Professions -->
      <div id="categoryProfessions" class="hidden space-y-6">
        <div id="professionsDetailContainer" class="space-y-4">
          <!-- Injected JS -->
        </div>
      </div>

    </section>

  </main>

  <script>
    // Cache-buster: browsers otherwise keep serving a stale roster after a sync.
    document.write(`<script src="data/guide.js?v=${Date.now()}"><\/script>`);
    document.write(`<script src="personal/roster.js?v=${Date.now()}"><\/script>`);
    document.write(`<script src="data/prices.js?v=${Date.now()}"><\/script>`);
    document.write(`<script src="data/trainers.js?v=${Date.now()}"><\/script>`);
    document.write(`<script src="data/vendors.js?v=${Date.now()}"><\/script>`);
    document.write(`<script src="data/npcs.js?v=${Date.now()}"><\/script>`);
    document.write(`<script src="data/dungeons.js?v=${Date.now()}"><\/script>`);
    document.write(`<script src="data/zone_quests.js?v=${Date.now()}"><\/script>`);
  </script>
  <script>
    // Code lives in js/; cache-busted like the data files so a browser never runs a stale copy.
    ['app', 'professions', 'characters', 'money', 'auction', 'recipes', 'camping', 'trainers', 'launch', 'route', 'ahpages', 'charmoney', 'legacy'].forEach(name =>
      document.write(`<script src="js/${name}.js?v=${Date.now()}"><\/script>`));
  </script>
  <script>init();</script>
</body>
</html>
